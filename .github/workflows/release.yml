# v* タグを push すると、Velopack でインストーラ一式を作って Release に公開する。
name: Release

# Actions 一覧の実行名を分かりやすくする（例: Release v1.0.15-pre）。
# 軽量タグだと既定の実行名がそっけないため run-name で明示する。
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: vpk ツールを導入
        run: dotnet tool install -g vpk

      - name: バージョン番号を算出
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # タグに '-'（例: 1.0.15-pre）が含まれればプレリリース扱いにする。
          # プレリリースは GitHub Release の pre-release フラグを立て、
          # 更新側で prerelease を取り込む設定(開発者モード)のユーザーだけに配信する。
          $isPre = if ($v -like '*-*') { 'true' } else { 'false' }
          "is_prerelease=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Velopack は単一ファイル化しない。フォルダ一式を発行する。
      - name: 発行（self-contained フォルダ）
        run: >
          dotnet publish SCtoolGui.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      # 既存リリースを取得しておくと、差分パッケージが生成される（初回は何も無くてOK）。
      - name: 既存リリースを取得（差分の土台）
        run: >
          vpk download github
          --repoUrl https://github.com/HorizontalArk/SCtoolGUI-release
          --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Velopack パッケージを作成
        run: >
          vpk pack
          --packId SCtoolGui
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe SCtoolGui.exe
          --packTitle SCtoolGui
          --shortcuts None

      # 通常リリース（タグに '-' なし）。全ユーザーの自動更新に配信される。
      - name: GitHub Release へ公開（通常）
        if: steps.ver.outputs.is_prerelease == 'false'
        run: >
          vpk upload github
          --repoUrl https://github.com/HorizontalArk/SCtoolGUI-release
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --releaseName ${{ github.ref_name }}
          --publish

      # プレリリース（タグに '-' あり、例: v1.0.15-pre）。--pre で pre-release フラグを立て、
      # prerelease を取り込む設定のユーザー（開発者モード）だけに配信する。
      - name: GitHub Release へ公開（プレリリース）
        if: steps.ver.outputs.is_prerelease == 'true'
        run: >
          vpk upload github
          --repoUrl https://github.com/HorizontalArk/SCtoolGUI-release
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
          --releaseName ${{ github.ref_name }}
          --pre
          --publish
